[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/frontier",
    "crates/fetch",
    "crates/parser",
    "crates/engine",
    "crates/python",
    "apps/mudfish",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Mullassery/MudFish"

[profile.release]
lto = true
codegen-units = 1
