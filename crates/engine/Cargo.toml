[package]
name = "mudfish-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Async crawl orchestration engine for Mudfish Crawler (fetch + frontier + parser wiring), independent of any CLI/binding layer"

[lib]
name = "mudfish_engine"

[dependencies]
anyhow = "1.0.104"
mudfish-core = { version = "0.1.1", path = "../core" }
mudfish-fetch = { version = "0.1.1", path = "../fetch" }
mudfish-frontier = { version = "0.1.1", path = "../frontier" }
mudfish-parser = { version = "0.1.1", path = "../parser" }
tokio = { version = "1.53.1", features = ["sync", "rt", "macros"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4"] }
