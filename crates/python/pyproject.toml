[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mudfish"
version = "0.1.1"
description = "Rust-native web crawling and intelligence engine — Python bindings"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Georgi Mullassery" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/Mullassery/MudFish"
Repository = "https://github.com/Mullassery/MudFish"

[tool.maturin]
python-source = "python"
module-name = "mudfish._mudfish"
include = ["LICENSE"]
