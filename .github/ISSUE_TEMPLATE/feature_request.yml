name: Feature request
description: Propose a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check `ROADMAP_HONEST.md` first — if this is browser rendering, structured/AI
        extraction, distributed crawling, persistence, or an API/MCP server, it's
        already a known, intentionally-deferred future phase rather than a gap
        nobody thought of. Still worth filing if you want to argue for reprioritizing
        it, or if it's genuinely new.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that Mudfish can't do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the CLI flag / Python API / behavior look like?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you're using today, or other tools you compared against.
